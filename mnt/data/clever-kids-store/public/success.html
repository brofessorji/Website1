<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your Clever Kids order</title><link rel="stylesheet" href="/assets/styles.css"></head><body><main class="section-shell section-space"><p class="eyebrow">ORDER COMPLETE</p><h1 style="font-family:Fraunces,Georgia,serif;font-size:56px">Your books are ready.</h1><p style="max-width:650px;color:#666b69">This is the local/demo delivery screen. In production, this page should only be reachable after your payment provider confirms the order server-side.</p><div id="downloads" style="max-width:760px"></div><p style="margin-top:30px"><a href="/">← Back to Clever Kids</a></p></main><script>const q=new URLSearchParams(location.search);const toks=(q.get('tokens')||'').split(',').filter(Boolean);const box=document.getElementById('downloads');if(!toks.length){box.innerHTML='<p>No delivery tokens were found.</p>'}else{box.innerHTML=toks.map((t,i)=>`<a class="button button-coral" style="display:block;margin:12px 0;width:max-content" href="/download?token=${encodeURIComponent(t)}">Download book ${i+1}</a>`).join('')}</script></body></html>
